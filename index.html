<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOP UP CASH</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }
    header {
      background: #111827;
      color: white;
      padding: 22px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 30px; }
    header p { margin: 8px 0 0; }
    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }
    h2 { margin-top: 0; }
    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }
    select, input, button {
      width: 100%;
      padding: 14px;
      margin-top: 7px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }
    button {
      background: #16a34a;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #15803d; }
    .payment {
      background: #f0fdf4;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <h1>TOP UP CASH</h1>
  <p>Service de recharge rapide</p>
</header>

<div class="container">

  <div class="card">
    <h2>🎮 Choisissez votre jeu</h2>

    <label>Jeu</label>
    <select id="game">
      <option>Free Fire</option>
      <option>eFootball</option>
      <option>PUBG Mobile</option>
      <option>Dream League Soccer</option>
      <option>Big Farm: Mobile Harvest</option>
    </select>

    <label>ID du joueur</label>
    <input id="playerId" type="text" placeholder="Entrez votre ID joueur">

    <label>Montant</label>
    <select id="amount">
      <option>100 HTG</option>
      <option>250 HTG</option>
      <option>500 HTG</option>
      <option>1000 HTG</option>
    </select>

    <button onclick="order()">Continuer</button>
  </div>

  <div class="card" id="paymentCard" style="display:none;">
    <h2>💳 Paiement</h2>

    <p>Choisissez votre moyen de paiement :</p>

    <div class="payment">
      <strong>MonCash</strong><br>
      Paiement par MonCash
    </div>

    <div class="payment">
      <strong>NatCash</strong><br>
      Paiement par NatCash
    </div>

    <button onclick="confirmOrder()">Confirmer la commande</button>
  </div>

  <div class="card" id="result" style="display:none;"></div>

</div>

<footer>
  © 2026 TOP UP CASH — Tous droits réservés
</footer>

<script>
function order() {
  const playerId = document.getElementById("playerId").value.trim();

  if (!playerId) {
    alert("Veuillez entrer votre ID joueur.");
    return;
  }

  document.getElementById("paymentCard").style.display = "block";
  document.getElementById("paymentCard").scrollIntoView({
    behavior: "smooth"
  });
}

function confirmOrder() {
  const game = document.getElementById("game").value;
  const playerId = document.getElementById("playerId").value;
  const amount = document.getElementById("amount").value;

  const result = document.getElementById("result");

  result.style.display = "block";
  result.innerHTML =
    "<h2>✅ Commande enregistrée</h2>" +
    "<p><strong>Jeu :</strong> " + game + "</p>" +
    "<p><strong>ID joueur :</strong> " + playerId + "</p>" +
    "<p><strong>Montant :</strong> " + amount + "</p>" +
    "<p>Le paiement MonCash/NatCash devra être configuré avant de traiter automatiquement la recharge.</p>";
}
</script>

</body>
                                                        </html>
